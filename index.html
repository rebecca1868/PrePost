/* ======================================================================
   1. 基礎重置
   ---------------------------------------------------------------------

   也沒用到）。這裡保留等效的重置並移除 Tailwind 其餘部分。
   包在 @layer base 內，讓下方未分層的樣式一律優先。
   ====================================================================== */

    margin: 0;

  hr {

    border-top-width: 1px
  }

  abbr:where([title]) {
    -webkit-text-decoration: underline dotted;
    text-decoration: underline dotted
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-size: inherit;
    font-weight: inherit
  }

  a {
    color: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit
  }

  b,
  strong {
    font-weight: bolder
  }

  code,
  kbd,
  samp,
  pre {
    font-family: var(--default-mono-font-family, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
    font-feature-settings: var(--default-mono-font-feature-settings, normal);
    font-variation-settings: var(--default-mono-font-variation-settings, normal);

  }

  small {

  sub,

    position: relative
  }

  }

  sup {

  }

  }

  img,
  svg,
  video,
  canvas,
  audio,
  iframe,
  embed,
  object {
    vertical-align: middle;
    display: block
  }

  img,
  video {
    max-width: 100%;
    height: auto
  }

  button,
  input,
  select,
  optgroup,
  textarea {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 1;
    background-color: #0000;
    border-radius: 0
  }

  ::file-selector-button {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 1;
    background-color: #0000;
    border-radius: 0
  }

  :where(select:is([multiple], [size])) optgroup {
    font-weight: bolder
  }

  :where(select:is([multiple], [size])) optgroup option {
    padding-inline-start: 20px
  }

  ::file-selector-button {
    margin-inline-end: 4px
  }

  ::placeholder {
    opacity: 1
  }

  @supports (not ((-webkit-appearance:-apple-pay-button))) or (contain-intrinsic-size:1px) {
    ::placeholder {
      color: currentColor
    }

    @supports (color:color-mix(in lab, red, red)) {
      ::placeholder {
        color: color-mix(in oklab, currentcolor 50%, transparent)
      }
    }
  }

  textarea {

  }

  ::-webkit-search-decoration {

  }

  }

  }

  }

  ::-webkit-datetime-edit {

  }

  }

/* ======================================================================
   2. 應用程式樣式
   ====================================================================== */

:root {
  --ink: #171a2b;
  --muted: #6f7280;
  --soft: #9a9ca8;
  --line: #e4e3e8;
  --surface: #ffffff;
  --canvas: #f7f5f1;
  --panel: #f0eef7;
  --accent: #4f5bff;
  --accent-deep: #3d47e8;
  --accent-soft: #eceeff;
  --violet: #8a5cff;
  --coral: #ff6b6b;
  --success: #27a86b;
  --danger: #d84a55;
  --shadow-sm: 0 6px 20px rgba(30, 27, 50, 0.06);
  --shadow-lg: 0 24px 70px rgba(30, 27, 50, 0.16);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
  font: inherit;
}

button,
label[for] {
  -webkit-tap-highlight-color: transparent;
}

button {

}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
label[for]:focus-visible {
  outline: 3px solid rgba(79, 91, 255, 0.28);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  z-index: 999;
  top: 12px;
  left: 12px;
  transform: translateY(-150%);
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  padding: 10px 14px;
  text-decoration: none;
}

.skip-link:focus {

}

.app-shell {

}

.topbar {
  position: sticky;
  z-index: 50;

  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 78px;
  padding: 14px clamp(20px, 4vw, 64px);
  border-bottom: 1px solid rgba(228, 227, 232, 0.9);
  background: rgba(247, 245, 241, 0.88);
  backdrop-filter: blur(18px);
}

.brand-lockup,
.topbar-actions,
.post-identity,
.engagement-row,
.form-section-title,
.metrics-heading,
.character-count,
.immersive-header-row {

}

.brand-lockup {
  gap: 13px;
}

.brand-mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(145deg, var(--accent), var(--violet));
  box-shadow: 0 9px 22px rgba(79, 91, 255, 0.28);
  color: #fff;
  font-size: 18px;
  font-weight: 800;
}

.eyebrow,
.section-kicker {

  font-weight: 750;
  letter-spacing: 0.16em;
}

.topbar h1 {
  margin: 0;
  font-size: 18px;

  letter-spacing: -0.03em;
}

.topbar-actions {

}

.save-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  font-size: 13px;
}

.status-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 4px rgba(39, 168, 107, 0.12);
}

.primary-button {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  box-shadow: 0 8px 20px rgba(79, 91, 255, 0.22);
  color: #fff;

  font-size: 14px;
  font-weight: 720;
  padding: 0 18px;

}

  background: var(--accent-deep);
  box-shadow: 0 12px 26px rgba(79, 91, 255, 0.28);
}

}

  opacity: 0.68;
}

  grid-template-columns: minmax(560px, 1.35fr) minmax(390px, 0.85fr);
}

.preview-panel,
.editor-panel {

.editor-panel {

}

.panel-heading {

}

.platform-pill,
.step-count {

  border: 1px solid rgba(23, 26, 43, 0.08);

  background: rgba(255, 255, 255, 0.72);

  font-weight: 680;

}

.platform-pill.ig {

}

.platform-pill.fb {

.preview-stage.is-capturing {

.preview-stage {

  width: 100%;
  max-width: 780px;
  min-height: 640px;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin: 0 auto;
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.44);
  box-shadow: inset 0 0 0 1px rgba(23, 26, 43, 0.025);

}

.stage-grid {

  background-image:

}

.social-card {

.social-card.fb.desktop.feed {

}

.platform-pill.yt {

}

/* 等比縮放外框
   ---------------------------------------------------------------------
   YouTube 桌面版與手機橫式是照固定寬度設計的，手機螢幕塞不下時整體縮小，
   而不是把版面重排——重排之後就不是「桌面版預覽」了。
   外框高度由 JS 依縮放比例算出，版面才不會多出一大塊空白。 */
.preview-scaler {
  position: relative;
  z-index: 1;
  display: flex;
  width: 100%;
  justify-content: center;
}

.preview-scaler-content {
  flex: none;
  transform-origin: top center;
}

.social-card.yt {
  border: 0;
  border-radius: 13px;
  background: #fff;
  color: #0f0f0f;
  font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  transition: none;
}

.social-card.yt.desktop.feed {
  width: min(100%, 720px);
}

.social-card.yt.mobile.feed {
  width: min(100%, 350px);
  border-radius: 19px;
}

.social-card.yt.mobile-landscape.feed {
  width: min(100%, 680px);
  border-radius: 18px;
  aspect-ratio: 16 / 9;
  background: #111;
  color: #fff;
}

.social-card.yt.mobile-landscape.feed.youtube-landscape-ad-card {
  width: min(100%, 760px);
  aspect-ratio: 1806 / 869;
  border-radius: 14px;
  background: #000;
}

.social-card.yt.youtube-shorts-card,
.social-card.yt.youtube-shorts-card.mobile.feed,
.social-card.yt.youtube-shorts-card.desktop.feed {

  color: #fff;
}

.yt-play-button {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 50%;
  display: grid;
  width: clamp(46px, 9%, 54px);
  aspect-ratio: 1;
  place-items: center;
  transform: translate(-50%, -50%);
  border: 0;
  border-radius: 50%;
  background: #242424;
  color: #fff;
  cursor: pointer;
  padding: 0;
  transition:
    background 150ms ease,
    transform 150ms ease,
    opacity 180ms ease;
}

.yt-play-button:hover {
  background: #171717;
  transform: translate(-50%, -50%) scale(1.04);
}

.yt-play-button:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}

.yt-play-button > span {
  width: 0;
  height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-left: 13px solid currentColor;
  transform: translateX(2px);
}

.yt-play-button.playing > span {
  position: relative;
  width: 17px;
  height: 21px;
  border: 0;
  transform: none;
}

.yt-play-button.playing > span::before,
.yt-play-button.playing > span::after {
  position: absolute;
  top: 0;
  width: 4px;
  height: 21px;
  background: currentColor;
  content: "";
}

.yt-play-button.playing > span::before {
  left: 0;
}

.yt-play-button.playing > span::after {
  right: 0;
}

.yt-player-upload {
  position: absolute;
  z-index: 2;
  inset: 0;
  border-radius: inherit;
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  object-fit: contain;
}

/* 點擊層：蓋住整個畫面，點任一處都能切換播放／暫停 */
.yt-player-surface {
  position: absolute;
  z-index: 3;
  inset: 0;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  appearance: none;
}

.yt-player-surface:focus-visible {
  outline: 2px solid #fff;
  outline-offset: -4px;
}

/* 控制列外框
   ---------------------------------------------------------------------
   inset + margin:auto + aspect-ratio 會複製 object-fit: contain 的行為，
   讓這個框和 SVG 的 viewBox 完全對齊，進度條才能精準疊在原本的位置。 */
.yt-control-layer {
  position: absolute;
  z-index: 4;
  inset: 0;
  margin: auto;
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: var(--yt-control-aspect);
  pointer-events: none;
}

.yt-control-bar {
  display: block;
  width: 100%;
  height: 100%;
}

/* 進度條 */
.yt-progress {
  position: absolute;
  pointer-events: auto;
  cursor: pointer;
  touch-action: none;
}

/* 手機直式的進度條掛在播放器上（不在控制列內），才能貼齊底緣、跨滿寬度 */
.yt-progress.on-player {
  z-index: 5;
}

/* 實際的軌道很細，這裡撐出一塊看不見的區域讓它比較好抓 */
.yt-progress::before {
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: 18px;
  transform: translateY(-50%);
  content: "";
}

.yt-progress:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}

.yt-progress-segment,
.yt-progress-buffered,
.yt-progress-played {
  position: absolute;
  top: 0;
  height: 100%;
  transition: background 220ms ease;
}

.yt-progress-segment {
  background: rgba(255, 255, 255, 0.33);
}

.yt-progress-buffered,
.yt-progress-played {
  left: 0;
}

.yt-progress-buffered {
  background: rgba(255, 255, 255, 0.8);
}

.yt-progress-played {
  background: #ff0000;
}

.yt-progress-knob {
  position: absolute;
  top: 50%;
  width: var(--yt-knob-size);
  aspect-ratio: 1;
  transform: translate(-50%, -50%) scale(1);
  border-radius: 50%;
  background: #ff0000;
  transition:
    transform 120ms ease,
    opacity 220ms ease;
}

.yt-progress:hover .yt-progress-knob,
.yt-progress:focus-visible .yt-progress-knob,
.yt-progress.scrubbing .yt-progress-knob {
  transform: translate(-50%, -50%) scale(1.35);
}

/* 時間碼
   ---------------------------------------------------------------------
   用 SVG 疊在控制列上，共用同一組 viewBox 座標，
   所以字級會跟著素材一起縮放，不必另外換算單位。 */
.yt-timecode {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.yt-timecode text {
  font-family: Roboto, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  font-weight: 500;
  font-variant-numeric: tabular-nums; /* 拖曳時數字寬度不會跳動 */
  fill: #fff;
}

/* 中央按鍵：桌機與手機橫式
   ---------------------------------------------------------------------
   播放後淡出，滑鼠移到畫面上才回來顯示暫停。
   （.is-playing 掛在播放器上代表狀態，.playing 掛在按鍵上只負責換成暫停圖示） */
.yt-player.is-playing:not(.autohide) .yt-play-button {
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0.9);
}

.yt-player.is-playing:not(.autohide):hover .yt-play-button {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

/* 手機直式：靜置後整層控制列淡出，只留一條灰線
   ---------------------------------------------------------------------
   只有播放中才會倒數；暫停時控制列一直留著，匯出 PNG 才不會抓到空畫面。 */
.yt-control-layer {
  transition: opacity 220ms ease;
}

.yt-player.is-idle .yt-control-layer,
.yt-player.is-idle .yt-play-button {
  opacity: 0;
  pointer-events: none;
}

.yt-progress.idle {
  cursor: default;
}

.yt-progress.idle .yt-progress-segment {
  background: rgba(255, 255, 255, 0.14);
}

.yt-progress.idle .yt-progress-buffered {
  background: rgba(255, 255, 255, 0.26);
}

.yt-progress.idle .yt-progress-played {
  background: rgba(255, 255, 255, 0.42);
}

.yt-progress.idle .yt-progress-knob {
  opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
  .yt-play-button,
  .yt-control-layer,
  .yt-progress-segment,
  .yt-progress-buffered,
  .yt-progress-played,
  .yt-progress-knob {
    transition: none;
  }
}

   點擊會穿透到這裡），但在文案與底部導覽列之下，避免誤觸。 */
.yt-shorts-surface {
  position: absolute;
  z-index: 3;
  inset: 0;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  appearance: none;
}

  outline-offset: -6px;
}

/* 暫停時中央浮出的播放三角形 */

  position: absolute;
  z-index: 7;
  top: 50%;
  left: 50%;
  width: 19%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%) scale(0.86);
  color: #fff;
  opacity: 0;
  filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45));
  pointer-events: none;
  transition:
    opacity 160ms ease,
    transform 160ms ease;
}

.yt-shorts-shell:not(.is-playing) .yt-shorts-play {
  opacity: 0.94;
  transform: translate(-50%, -50%) scale(1);
}

}

  }

      function readMediaDimensions(url, type) {
        return new Promise((resolve) => {
          let settled = false;
          let timer = 0;
          const finish = (width, height) => {
            if (settled) return;
            settled = true;
            window.clearTimeout(timer);
            resolve({ width: Math.max(1, width), height: Math.max(1, height) });
          };
          timer = window.setTimeout(() => finish(1, 1), 8e3);
          if (type === "image") {
            const image = new window.Image();
            image.onload = () => finish(image.naturalWidth, image.naturalHeight);
            image.onerror = () => finish(1, 1);
            image.src = url;
            return;
          }
          const video = document.createElement("video");
          video.preload = "metadata";
          video.onloadedmetadata = () => finish(video.videoWidth, video.videoHeight);
          video.onerror = () => finish(1, 1);
          video.src = url;
        });
      }

        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const rest = String(total % 60).padStart(2, "0");

      function YouTubeProgressBar({ layout, progress, idle, scrubbing, onScrubbingChange, onSeek }) {
        const trackRef = useRef(null);

        const seekFromPointer = (event) => {
          const rect = trackRef.current?.getBoundingClientRect();
          if (!rect?.width) return;
          onSeek(clamp01((event.clientX - rect.left) / rect.width));
        };

        const handlePointerDown = (event) => {
          event.preventDefault();
          event.currentTarget.setPointerCapture(event.pointerId);
          onScrubbingChange(true);
          seekFromPointer(event);
        };

        const handlePointerMove = (event) => {
          if (scrubbing) seekFromPointer(event);
        };

        const stopScrubbing = (event) => {
          if (!scrubbing) return;
          if (event.currentTarget.hasPointerCapture(event.pointerId)) {
            event.currentTarget.releasePointerCapture(event.pointerId);
          }
          onScrubbingChange(false);
        };

        const handleKeyDown = (event) => {
          const step = event.shiftKey ? 0.1 : 0.02;
          if (event.key === "ArrowRight") onSeek(clamp01(progress + step));
          else if (event.key === "ArrowLeft") onSeek(clamp01(progress - step));
          else if (event.key === "Home") onSeek(0);
          else if (event.key === "End") onSeek(1);
          else return;
          event.preventDefault();
        };

        const played = `${(progress * 100).toFixed(3)}%`;
        // 已緩衝的長度永遠比播放點再多一小段，看起來才像真的在載入
        const buffered =
          layout.buffered === null
            ? null
            : `${clamp01(Math.max(layout.buffered, progress + 0.035)) * 100}%`;

        const classNames = [
          "yt-progress",
          layout.progressAnchor === "player" ? "on-player" : "",
          scrubbing ? "scrubbing" : "",
          idle ? "idle" : "",
        ];

        return (
          <div
            ref={trackRef}
            className={classNames.filter(Boolean).join(" ")}
            style={{ ...layout.track, "--yt-knob-size": layout.knob }}
            role="slider"
            tabIndex={0}
            aria-label="播放進度"
            aria-valuemin={0}
            aria-valuemax={100}
            aria-valuenow={Math.round(progress * 100)}
            aria-valuetext={`${Math.round(progress * 100)}%`}
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={stopScrubbing}
            onPointerCancel={stopScrubbing}
            onKeyDown={handleKeyDown}
          >
            {(layout.segments ?? [{ left: "0%", width: "100%" }]).map((segment, index) => (
              <span key={index} className="yt-progress-segment" style={segment} />
            ))}
            {buffered && <span className="yt-progress-buffered" style={{ width: buffered }} />}
            <span className="yt-progress-played" style={{ width: played }} />
            <span className="yt-progress-knob" style={{ left: played }} />
          </div>
        );
      }

        const [isPlaying, setIsPlaying] = useState(false);
        const [progress, setProgress] = useState(YT_INITIAL_PROGRESS);
        const [duration, setDuration] = useState(null);
        const [controlsVisible, setControlsVisible] = useState(true);
        const [wakeAt, setWakeAt] = useState(0);
        const [scrubbing, setScrubbing] = useState(false);
        const layout = YT_CONTROL_LAYOUTS[controlBar] ?? YT_CONTROL_LAYOUTS.desktop;

        useEffect(() => {
          setIsPlaying(false);
          setProgress(YT_INITIAL_PROGRESS);
          setDuration(null);
          setControlsVisible(true);
        }, [mediaItem?.id]);

        // 任何操作都把控制列叫回來，並重新開始倒數
        const wakeControls = () => {
          setControlsVisible(true);
          setWakeAt(Date.now());
        };

        // 只有「播放中」才會自動淡出；暫停時控制列一直留著。
        // 這和真實 YouTube 一致，也確保匯出 PNG 時預設抓得到完整畫面。
        useEffect(() => {
          if (!layout.autoHide || !isPlaying || !controlsVisible) return undefined;
          const timer = setTimeout(() => setControlsVisible(false), YT_CONTROLS_IDLE_MS);
          return () => clearTimeout(timer);
        }, [layout.autoHide, isPlaying, controlsVisible, wakeAt]);

        const togglePlayback = () => {
          wakeControls();
          const video = videoRef.current;
          if (!video) {
            setIsPlaying((playing) => !playing);
            return;
          }
          if (video.paused) {
            void video.play().catch(() => setIsPlaying(false));
          } else {
            video.pause();
          }
        };

        // 有影片就跟著真實播放進度走；只有圖片時，進度條純粹是視覺狀態。
        //
        // 這裡刻意不用 <video> 的 timeupdate 事件——瀏覽器一秒只發四次左右，
        // 進度條會一格一格跳。改成每一幀讀一次 currentTime，畫面才會滑順。
        useEffect(() => {
          const video = videoRef.current;
          if (!video || !isPlaying || scrubbing) return undefined;
          let frame = requestAnimationFrame(function step() {
            if (video.duration) setProgress(video.currentTime / video.duration);
            frame = requestAnimationFrame(step);
          });
          return () => cancelAnimationFrame(frame);
        }, [isPlaying, scrubbing, mediaItem?.id]);

        const seek = (ratio) => {
          wakeControls();
          setProgress(ratio);
          const video = videoRef.current;
          if (video?.duration) video.currentTime = ratio * video.duration;
        };

        const idle = layout.autoHide && !controlsVisible;
        const totalSeconds = duration ?? YT_PLACEHOLDER_DURATION;
        const progressBar = (
          <YouTubeProgressBar
            layout={layout}
            progress={progress}
            idle={idle}
            scrubbing={scrubbing}
            onScrubbingChange={setScrubbing}
            onSeek={seek}
          />
        );

        const playerClasses = [
          "yt-player",
          isAd ? "is-ad" : "",
          isPlaying ? "is-playing" : "",
          layout.autoHide ? "autohide" : "",
          idle ? "is-idle" : "",
        ];

        return (
          <div
            className={playerClasses.filter(Boolean).join(" ")}
            aria-label={isAd ? "YouTube 手機直式影片廣告預覽" : "YouTube 16:9 影片播放器預覽"}
            onPointerMove={layout.autoHide ? wakeControls : undefined}
          >
            {mediaItem ? (
              mediaItem.type === "video" ? (
                <video
                  ref={videoRef}
                  className="yt-player-upload"
                  src={mediaItem.url}
                  aria-label={mediaItem.name}
                  autoPlay={isAd}
                  loop={isAd}
                  muted={isAd}
                  playsInline
                  onPlay={() => setIsPlaying(true)}
                  onPause={() => setIsPlaying(false)}
                  onEnded={() => setIsPlaying(false)}
                  onSeeked={(event) => {
                    const video = event.currentTarget;
                    if (video.duration) setProgress(video.currentTime / video.duration);
                  }}
                  onLoadedMetadata={(event) => {
                    const seconds = event.currentTarget.duration;
                    setDuration(Number.isFinite(seconds) && seconds > 0 ? seconds : null);
                  }}
                />
              ) : (
                <img className="yt-player-upload" src={mediaItem.url} alt={mediaItem.name} />
              )

                <span>BETTER DAYS STUDIO</span>
                <strong>
                  讓內容被看見，

                </strong>
                <small>品牌內容設計筆記</small>

            {isAd ? (

                className="yt-ad-overlay"
                src={ASSETS["youtube-mobile-ad-overlay.svg"]}

                aria-hidden="true"

            ) : (

                {/* 點畫面任一處就切換播放／暫停，和 YouTube 一樣 */}

      const YT_DESIGN_WIDTHS = {
        desktop: 720,
        "mobile-landscape": 680,
        "mobile-landscape-ad": 760,
      };

      // 內容維持設計寬度，外框高度跟著縮放後的實際高度走，版面才不會多出空白。
      // frozen 為 true 時暫時還原成 1:1，讓匯出的 PNG 保持原尺寸解析度。

      function ScaledPreview({ designWidth, frozen = false, children }) {
        const frameRef = useRef(null);
        const contentRef = useRef(null);
        const [scale, setScale] = useState(1);
        const [height, setHeight] = useState(null);

        useEffect(() => {
          const frame = frameRef.current;
          const content = contentRef.current;
          if (!frame || !content || typeof ResizeObserver === "undefined") return undefined;

          const measure = () => {
            const available = frame.clientWidth;
            if (!available) return;
            const next = Math.min(1, available / designWidth);
            setScale(next);
            setHeight(content.offsetHeight * next);
          };

          measure();
          const observer = new ResizeObserver(measure);
          observer.observe(frame);
          observer.observe(content);
          return () => observer.disconnect();
        }, [designWidth]);

        const applied = frozen ? 1 : scale;

        // 其餘版位不需要縮放，直接原樣輸出（hooks 已在上面全部跑完）
        if (!designWidth) return children;

        return (
          <div
            ref={frameRef}
            className="preview-scaler"
            style={{ height: frozen || height === null ? undefined : height }}
          >
            <div
              ref={contentRef}
              className="preview-scaler-content"
              style={{ width: designWidth, transform: `scale(${applied})` }}
            >
              {children}
            </div>
          </div>
        );
      }

            id: `${Date.now()}-${file.name}`,
            name: file.name,
            type: "video",
            url,
            width,
            height,
            orientation: detectOrientation(width, height),

          setMedia((items) => {
            const target = items.find((item) => item.id === id);

            return items.filter((item) => item.id !== id);
          });
          setStatus("已移除素材");

          setMedia((items) => {
            const from = items.findIndex((item) => item.id === id);
            const to = from + direction;
            if (from < 0 || to < 0 || to >= items.length) return items;
            const copy = [...items];
            [copy[from], copy[to]] = [copy[to], copy[from]];
            return copy;
          });

            platform === "fb" && isGrid

            const to = items.findIndex((item) => item.id === targetId);

            return copy;

                            <input
                              type="number"
                              min="0"
                              max="999999"
                              value={likes}
                              onChange={(event) => setLikes(Number(event.target.value))}
                            />
                          </label>
                          <label>
                            留言
                            <input
                              type="number"
                              min="0"
                              max="999999"
                              value={comments}
                              onChange={(event) => setComments(Number(event.target.value))}
                            />
                          </label>
                          <label>
                            轉發
                            <input
                              type="number"
                              min="0"
                              max="999999"
                              value={forwards}
                              onChange={(event) => setForwards(Number(event.target.value))}
                            />
                          </label>
                          <label>
                            分享
                            <input
                              type="number"
                              min="0"
                              max="999999"
                              value={shares}
                              onChange={(event) => setShares(Number(event.target.value))}
                            />
                          </label>
                        </div>
                      </section>
                    )}

                    {platform !== "yt" && (
                      <section className="form-section" aria-labelledby="section-media">
                        <div className="form-section-title">
                          <span>03</span>
                          <div>
                            <h3 id="section-media">上傳素材</h3>
                            <p>圖片、影片皆可，多檔可調整順序</p>
                          </div>
                        </div>

                        <input
                          ref={fileInputRef}
                          id="mediaUpload"
                          className="visually-hidden"
                          type="file"
                          accept="image/*,video/*"
                          multiple
                          onChange={handleFiles}
                        />
                        <label className="upload-zone" htmlFor="mediaUpload">
                          <span className="upload-icon" aria-hidden="true">
                            ↑
                          </span>
                          <strong>選擇檔案或拖放至此</strong>
                          <small>建議使用 JPG、PNG、MP4；單次可選多個檔案</small>
                        </label>

                        {media.length > 0 && (
                          <div className="media-manager" aria-label="已上傳的素材">
                            {media.map((item, index) => (
                              <div
                                className="media-item"
                                key={item.id}
                                draggable
                                onDragStart={(event) => {
                                  event.dataTransfer.effectAllowed = "move";
                                  setDraggedId(item.id);
                                }}
                                onDragOver={(event) => event.preventDefault()}
                                onDrop={() => dropMedia(item.id)}
                              >
                                <button
                                  type="button"
                                  className="media-select"
                                  onClick={() => setActiveMedia(index)}
                                  aria-label={`預覽 ${item.name}`}
                                >
                                  <Media item={item} label="" />
                                  <span>{index + 1}</span>
                                </button>
                                <div className="media-item-info">
                                  <strong>{item.name}</strong>
                                  <div className="media-meta-row">
                                    {index === 0 && platform === "fb" && isGrid && (
                                      <span className="hero-media-badge">首圖・決定版位</span>
                                    )}
                                    <small>
                                      {item.type === "video" ? "影片" : "圖片"}・
                                      {orientationLabel(item.orientation)}・{item.width} ×{" "}
                                      {item.height}
                                    </small>
                                  </div>
                                </div>
                                <div className="media-item-actions">
                                  <button
                                    type="button"
                                    onClick={() => moveMedia(item.id, -1)}
                                    disabled={index === 0}
                                    aria-label="向前移動"
                                  >
                                    ←
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => moveMedia(item.id, 1)}
                                    disabled={index === media.length - 1}
                                    aria-label="向後移動"
                                  >
                                    →
                                  </button>
                                  <button
                                    type="button"
                                    className="remove-button"
                                    onClick={() => removeMedia(item.id)}
                                    aria-label={`移除 ${item.name}`}
                                  >
                                    ×
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </section>
                    )}

                    {platform !== "yt" && (
                      <section className="form-section" aria-labelledby="section-copy">
                        <div className="form-section-title">
                          <span>04</span>
                          <div>
                            <h3 id="section-copy">貼文文案</h3>
                            <p>確認語氣與換行是否自然</p>
                          </div>
                        </div>

                        <label className="field-label" htmlFor="caption">
                          文案內容
                        </label>
                        <textarea
                          id="caption"
                          value={caption}
                          maxLength={2200}
                          onChange={(event) => setCaption(event.target.value)}
                        />
                        <div className="character-count">
                          <span>可使用換行與表情符號</span>
                          <strong>{caption.length} / 2,200</strong>
                        </div>
                      </section>
                    )}
                  </div>
                </aside>
              </div>

              <div className="mobile-action-bar">
                <button
                  type="button"
                  className="primary-button"
                  onClick={downloadPreview}
                  disabled={downloading}
                >
                  <span aria-hidden="true">↓</span>
                  {downloading ? "製作中…" : "下載 PNG"}
                </button>
              </div>
            </main>
          </>
        );
      }
